<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provinces and Calculator</title>
    <style>
        body {
            background-color: rgb(0, 21, 255);
            margin: 0;
            padding: 20px;
            font-family: 'Times New Roman', Times, serif;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }
        .province, .calc-container {
            padding: 15px;
            border-radius: 10px;
            width: 45%;
            margin-bottom: 30px;
        }
        .place {
            margin-top: 10px;
            border-radius: 10px;
            padding: 50px;
            color: white;
        }
        img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            display: block;
            margin-top: 10px;
        }
        .hidden {
            display: none;
            margin-top: 10px;
            font-weight: bold;
            color: darkblue;
        }
        button {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background-color: navy;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: darkred;
        }
        .calc-container {
            background-color: white;
            color: black;
            text-align: center;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <h1 style="text-align:center; color:white;">EPL & Calculator</h1>

    <div class="container">

        <!-- Province 1 -->
        <div class="Manchester" style="background-color: #ff9999; padding:70px;">Red
            <div class="place1" style="background-color: #0047ab; color:rgb(255, 255, 255); padding:25px;">Ronaldo</div>
            <div class="place2" style="background-color: #ff0000; color:rgb(255, 255, 255); padding:25px;">Messi</div>
            <p class="hidden msg1">Good Team </p>
            <button onclick="changeDivColor('Manchester')">Change My Color</button>
        </div>

        <!-- Province 3 -->
        <div class="Liverpool" style="background-color: #99f0ff; padding:100px;">Kloop
            <div class="place1" style="background-color: #003399; color:white; padding:50px;">Gerrad</div>
            <div class="place2" style="background-color: #ffffff; color:black; padding:50px;">Van Dijk</div>
            <p id="msg2" class="hidden"> Orangee </p>
            <button onclick="showMessage('msg2')">Show Message</button>
        </div>

        <!-- Province 5 -->
        <div class="Aresneal" style="background-color: #99ccff; padding:80px;">Arteta
            <div class="place1" style="background-color: #da291c; color:white; padding:20px;">Henry</div>
            <div class="place2" style="background-color: #6cabdd; color:white; padding:30px;">Van Perise</div>
            <p id="msg3" class="hidden">Right now on top</p>
            <button id="toggleBtn3" onclick="toggleMessage('msg3', 'toggleBtn3')">Show Message</button>
        </div>

        <!-- Province 4 -->
        <div class="Totenam" style="background-color: #ffcc99; padding:110px;">White
            <div class="place1" style="background-color: #003366; color:white; padding:70px;">Son</div>
            <div class="place2" style="background-color: #ff6600; color:white; padding:35px;">Kane</div>
            <p id="msg4" class="hidden"> 0 trophies </p>
            <img id="img4" src="/Users/nishant/Downloads/Kane.jpg" alt="Kane">
            <button onclick="changeImage('img4')">Change Image</button>
        </div>

       
        <div class="calc-container">
            <h2>Simple Calculator</h2>
            <p id="calcResult">Click a button to see the result of 5 and 6.</p>
            <button onclick="toggleCalculation('sum')">Sum</button>
            <button onclick="toggleCalculation('sub')">Subtraction</button>
            <button onclick="toggleCalculation('mul')">Multiplication</button>
            <button onclick="toggleCalculation('div')">Division</button>
        </div>

    </div>

    <div style="text-align:center; margin-top:30px;">
        <button onclick="changeBackground()">Change Page Background</button>
    </div>

    <script>
        let toggleImage = false;
        let calcVisible = {
            sum: false,
            sub: false,
            mul: false,
            div: false
        };

        function changeDivColor(id) {
            const colors = ['#FFD700', '#FF69B4', '#00FA9A', '#1E90FF', '#FF4500'];
            const random = colors[Math.floor(Math.random() * colors.length)];
            document.querySelector(`.${id}`).style.backgroundColor = random;
        }

        function showMessage(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function toggleMessage(id, btnId) {
            const msg = document.getElementById(id);
            const btn = document.getElementById(btnId);
            if (msg.classList.contains('hidden')) {
                msg.classList.remove('hidden');
                btn.textContent = "Hide Message";
            } else {
                msg.classList.add('hidden');
                btn.textContent = "Show Message";
            }
        }

        function changeImage(id) {
            const img = document.getElementById(id);
            if (toggleImage) {
                img.src = "/Users/niri/Downloads/PGSLOGO.png";
            } else {
                img.src = "/Users/niri/Downloads/LOGO.png";
            }
            toggleImage = !toggleImage;
        }

        function changeBackground() {
            const colors = ['#fffacd', '#d1f7ff', '#f0fff0', '#f5f5dc', '#ffefd5'];
            document.body.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }

        function toggleCalculation(type) {
            const result = document.getElementById('calcResult');
            const a = 5;
            const b = 6;

            if(type === 'sum') {
                if(!calcVisible.sum) {
                    result.textContent = `Sum: ${a} + ${b} = ${a+b}`;
                } else {
                    result.textContent = "Click a button to see the result of 5 and 6.";
                }
                calcVisible.sum = !calcVisible.sum;
            }

            if(type === 'sub') {
                if(!calcVisible.sub) {
                    result.textContent = `Subtraction: ${a} - ${b} = ${a-b}`;
                } else {
                    result.textContent = "Click a button to see the result of 5 and 6.";
                }
                calcVisible.sub = !calcVisible.sub;
            }

            if(type === 'mul') {
                if(!calcVisible.mul) {
                    result.textContent = `Multiplication: ${a} * ${b} = ${a*b}`;
                } else {
                    result.textContent = "Click a button to see the result of 5 and 6.";
                }
                calcVisible.mul = !calcVisible.mul;
            }

            if(type === 'div') {
                if(!calcVisible.div) {
                    result.textContent = `Division: ${a} / ${b} = ${(a/b).toFixed(2)}`;
                } else {
                    result.textContent = "Click a button to see the result of 5 and 6.";
                }
                calcVisible.div = !calcVisible.div;
            }
        }
    </script>

</body>
</html>
